version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: resiliencia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resiliencia_ve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resiliencia_ve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resiliencia_network

  redis:
    image: redis:7-alpine
    container_name: resiliencia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resiliencia_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resiliencia_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resiliencia_network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resiliencia_celery_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resiliencia_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resiliencia_celery_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resiliencia_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  resiliencia_network:
    driver: bridge
